<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TASKFLOW — Personal Task List | EdBytes Milestone 3</title>
  <meta name="description" content="TASKFLOW is a clean, accessible personal task manager built for EdBytes Full Stack Development Internship Milestone 3.">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-wrapper">
    <header class="app-header">
      <div class="internship-badge">EdBytes — Full Stack Development Internship</div>
      <h1 class="app-title">TASKFLOW</h1>
      <p class="app-subtitle">Your simple personal task manager.</p>
      <p class="app-tagline">Plan your day. Complete one task at a time.</p>
    </header>

    <main class="app-main">
      <section class="task-form-card" aria-labelledby="form-heading">
        <h2 id="form-heading" class="sr-only">Add a new task</h2>
        <form id="form" class="task-form" novalidate>
          <div class="input-group">
            <div class="label-row">
              <label for="text" class="input-label">Task description</label>
              <span id="char-count" class="char-count" aria-live="polite">0/200</span>
            </div>
            <div class="input-row">
              <input
                id="text"
                type="text"
                maxlength="200"
                placeholder="What do you need to do?"
                autocomplete="off"
                aria-describedby="char-count"
              >
              <button id="add-btn" type="submit" class="btn-primary">Add Task</button>
            </div>
          </div>
        </form>
        <p id="message" role="status" aria-live="polite" class="status-message"></p>
      </section>

      <section class="task-list-section" aria-labelledby="list-heading">
        <div class="list-header">
          <h2 id="list-heading" class="section-title">My task list</h2>
          <span id="task-counter" class="task-counter" aria-live="polite">0 tasks</span>
        </div>
        <ul id="list" class="task-list"></ul>
      </section>
    </main>

    <footer class="app-footer">
      <p>Built as part of the EdBytes Full Stack Development Internship.</p>
    </footer>
  </div>
</body>
</html>
